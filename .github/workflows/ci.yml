name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: voidzero-dev/setup-vp@v1.17.0
        with:
          node-version: '24'
          cache: true

      - run: vp install

      - name: Generate the Prisma client
        run: vp run prisma:generate
        working-directory: apps/api

      - run: vp check
      - run: vp test
      - run: vp run check:spec-coverage --no-cache

      - name: Install the Playwright browser
        run: vp exec playwright install --with-deps chromium

      - name: Apply Prisma migrations for the e2e database
        run: vp run prisma:deploy
        working-directory: apps/api

      - name: Run the Playwright suite
        run: vp run test:e2e

  docker:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # Serialised, not cancelled: two overlapping main pushes must not let the
    # older run publish `prod` after the newer one.
    concurrency:
      group: docker-publish
      cancel-in-progress: false

    # The repository-wide default workflow token is read-only, so the GHCR push
    # needs `packages: write` here; it stays job-scoped and never widens the
    # repository default.
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: api
            dockerfile: docker/Dockerfile.api
          - service: web
            dockerfile: docker/Dockerfile.web

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=prod,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
