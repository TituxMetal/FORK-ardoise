name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: voidzero-dev/setup-vp@v1.17.0
        with:
          node-version: '24'
          cache: true

      - run: vp install

      - name: Generate the Prisma client
        run: vp run prisma:generate
        working-directory: apps/api

      - run: vp check
      - run: vp test
      - run: vp run check:spec-coverage --no-cache

      - name: Install the Playwright browser
        run: vp exec playwright install --with-deps chromium

      - name: Apply Prisma migrations for the e2e database
        run: vp run prisma:deploy
        working-directory: apps/api

      - name: Run the Playwright suite
        run: vp run test:e2e

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'pull_request'

    # The publish job runs on `main` pushes only, so this is where a pull
    # request proves both Dockerfiles build before the code lands. It never
    # logs in to a registry and never pushes; `packages: write` stays on the
    # publish job, and the cache is read here, never written.
    permissions:
      contents: read

    strategy:
      matrix:
        include:
          - service: api
            dockerfile: docker/Dockerfile.api
          - service: web
            dockerfile: docker/Dockerfile.web

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}

  docker:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # Two things keep `prod` on the newest commit. The group serialises the two
    # publishes of one image and is per service, not cancelled, because GitHub
    # keeps only one pending job per group: a shared group would drop the older
    # run's queued leg. The group cannot order the runs themselves, since a job
    # enters it when its `ci` finishes and an older commit whose `ci` ran slow
    # can finish last. The tip check below closes that: a run whose commit main
    # has moved past publishes its own `sha-<hash>` and leaves `prod` alone.
    concurrency:
      group: docker-publish-${{ matrix.service }}
      cancel-in-progress: false

    # The repository-wide default workflow token is read-only, so the GHCR push
    # needs `packages: write` here; it stays job-scoped and never widens the
    # repository default.
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: api
            dockerfile: docker/Dockerfile.api
          - service: web
            dockerfile: docker/Dockerfile.web

    steps:
      - uses: actions/checkout@v7

      - name: Check the commit is still the tip of main
        id: tip
        run: |
          set -o pipefail
          tip=$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)
          promote=true
          if [ "$tip" != "$GITHUB_SHA" ]; then
            promote=false
            echo "::notice::main moved to ${tip}; prod not promoted."
          fi
          echo "promote=$promote" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.service }}
          # The sha tag is immutable and always published; `prod` and `latest`
          # are promotions only the newest commit on main may perform.
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ steps.tip.outputs.promote }}
            type=raw,value=prod,enable=${{ steps.tip.outputs.promote }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
